# Session Repair
# Two-step diagnose and conditional repair recipe for broken Amplifier sessions.
#
# Step 1 (diagnose) always runs — analyzes the session transcript for all known
# pathologies and reports with severity. Sets needs_repair=true when CRITICAL or
# WARNING issues are found.
#
# Step 2 (repair) runs only when diagnose.needs_repair is true — applies the
# minimum-invasive repairs: backup, inject synthetic tool results, verify.
#
# Usage:
#   amplifier run "execute provider-doctor:recipes/session-repair.yaml
#     with session_id=<session-id>"

name: "session-repair"
description: "Diagnose a broken session and prepare only a supported separate repair copy"
version: "1.0.0"
author: "Provider Doctor Bundle"
tags: ["session", "repair", "diagnose", "orphaned-tool-calls", "ordering-violations"]

context:
  session_id: ""  # Required: the session ID to diagnose and repair

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Diagnose
  # Always runs. Analyzes the session for all known transcript pathologies.
  # Reports findings with severity and sets needs_repair=true when CRITICAL or
  # WARNING issues are found.
  # ---------------------------------------------------------------------------
  - id: "diagnose"
    agent: "provider-doctor:session-doctor"
    prompt: |
      Analyze session {{session_id}} for transcript issues.

      Locate the session at ~/.amplifier/sessions/{{session_id}}/ and examine
      both metadata.json and events.jsonl thoroughly.

      Check for all of the following issue types:

      1. **Orphaned tool calls** — tool_use events with no matching tool_result
         in the subsequent user turn. These cause provider rejection on resume.

      2. **Ordering violations** — consecutive messages from the same role
         (two assistant turns in a row, or two user turns in a row).

      3. **Oversized transcripts** — total character count exceeds 500K chars.
         Flag as oversized if the transcript is too large for normal inference.

      4. **Truncated or malformed events** — event lines that are not valid JSON,
         or final events missing required fields (no stop_reason, no input, etc.).

      5. **Duplicate entries** — identical event IDs or identical content
         appearing more than once in the transcript.

      Report all findings with severity ratings:
        - CRITICAL: session cannot resume without repair
        - WARNING: session may fail or produce incorrect output
        - MEDIUM: session is degraded; repair recommended
        - LOW: minor anomaly; monitor only

      Set needs_repair=true only when the actual bundled helper accepts the
      direct role/content format and identifies unambiguous missing tool results
      eligible for a separate copy. Unsupported envelopes, malformed/truncated
      events, duplicate IDs, delayed results and ambiguous ordering violations
      need review, even if severity is CRITICAL or WARNING; set needs_repair=false
      and report that gap. A finding alone does not authorize an in-place edit.

      Return your report followed by exactly one line in this format:
        NEEDS_REPAIR: true
      or
        NEEDS_REPAIR: false
    output: "diagnose"
    parse_output:
      needs_repair: "NEEDS_REPAIR: (true|false)"
    timeout: 300

  # ---------------------------------------------------------------------------
  # Step 2: Repair
  # Only runs when diagnose.needs_repair is true.
  # Preserves source/backup, invokes the copy-only helper for eligible orphaned
  # calls, and verifies structure without claiming a live provider resume.
  # ---------------------------------------------------------------------------
  - id: "repair"
    condition: "{{diagnose.needs_repair}}"
    agent: "provider-doctor:session-doctor"
    prompt: |
      Prepare a separate repair copy for session {{session_id}} based on:

      {{diagnose}}

      Preserve the original source and any backup. Resolve the actual transcript
      format and the bundled skills/session-doctor/scripts/session_doctor.py helper.
      An Amplifier events.jsonl envelope is not automatically direct role/content
      JSONL. For unsupported or ambiguous input, report the gap without writing.

      For a supported direct role/content input with unambiguous orphaned tool
      calls, select a new explicit repair-copy destination and invoke the helper
      with SOURCE --repair-copy NEW_DESTINATION. It creates the destination
      exclusively and refuses source overwrite or an existing target.

      The helper may inject synthetic tool_result error markers only for calls
      whose result is absent. Markers mean interrupted, with no execution result;
      never invent successful tool output. If the helper rejects duplicate IDs,
      delayed results, malformed events or ordering violations, do not hand-edit,
      insert role-bridging messages or reorder the transcript to bypass it.

      Verify the separate copy and report source/copy identities, inserted IDs,
      structural results, unchanged original and remaining findings. A structural
      PASS is not proof of live provider resumption: report that as NOT TESTED
      until separately observed through the actual authorized host.

      REWIND truncates history and is not implemented by this helper. It requires
      an explicit user request, a known-format separate candidate and review; do
      not truncate or replace the source as a side effect of this recipe.
    output: "repair"
    timeout: 600
